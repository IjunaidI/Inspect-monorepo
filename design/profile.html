<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-font-sans: var(--font-sans);
        --font-font-heading: var(--font-heading);
        --font-font-serif: var(--font-serif);
        --font-font-mono: var(--font-mono);
      }

      @theme {
        --radius-xs: calc(var(--radius) - 8px);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
        --radius-2xl: calc(var(--radius) + 8px);
        --radius-3xl: calc(var(--radius) + 16px);
        --radius-4xl: calc(var(--radius) + 24px);
      }

      * {
        corner-shape: var(--shape, round);
      }

      .rounded-full, .rounded-none,
      .rounded-t-full, .rounded-t-none,
      .rounded-r-full, .rounded-r-none,
      .rounded-b-full, .rounded-b-none,
      .rounded-l-full, .rounded-l-none,
      .rounded-s-full, .rounded-s-none,
      .rounded-e-full, .rounded-e-none,
      .rounded-tl-full, .rounded-tl-none,
      .rounded-tr-full, .rounded-tr-none,
      .rounded-bl-full, .rounded-bl-none,
      .rounded-br-full, .rounded-br-none,
      .rounded-ss-full, .rounded-ss-none,
      .rounded-se-full, .rounded-se-none,
      .rounded-es-full, .rounded-es-none,
      .rounded-ee-full, .rounded-ee-none {
        corner-shape: round;
      }

      @utility rounded-* {
        border-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-t-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-r-* {
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-b-* {
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-l-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-tl-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-tr-* {
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-bl-* {
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-br-* {
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-s-* {
        border-start-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-end-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-e-* {
        border-start-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-end-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-ss-* {
        border-start-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-se-* {
        border-start-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-es-* {
        border-end-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-ee-* {
        border-end-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }

      :root {
        --shape: round;
        --shape-multiplier: 1;

          --background: #fdfcf8;
        --foreground: #1a331c;
        --primary: #3a7d44;
        --primary-foreground: #ffffff;
        --secondary: #e8ddcb;
        --secondary-foreground: #2f4f34;
        --muted: #f2eee6;
        --muted-foreground: #5c6b5e;
        --accent: #dcb878;
        --accent-foreground: #1a331c;
        --destructive: #cf4444;
        --card: #ffffff;
        --card-foreground: #1a331c;
        --popover: #ffffff;
        --popover-foreground: #1a331c;
        --border: #e6e0d4;
        --input: #f2eee6;
        --ring: #3a7d44;
        --chart-1: #3a7d44;
        --chart-2: #dcb878;
        --chart-3: #8c9e8d;
        --chart-4: #c25e00;
        --chart-5: #5c7cfa;

        --font-sans: "Inter";
        --font-heading: "Libre Baskerville";
        --font-serif: "Playfair Display";
        --font-mono: "JetBrains Mono";

        --radius: 0.75rem;
      }

      /* Prevent layout shift for icons without explicit dimensions */
      iconify-icon:not([width]):not([height]) {
        display: inline-block;
        width: 1em;
        height: 1em;
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="h-full bg-background flex flex-col font-sans">
      <header class="pt-16 pb-10 px-6 bg-gradient-to-b from-primary/10 to-background text-center">
        <div class="relative inline-block mb-4">
          <div
            class="size-28 rounded-full overflow-hidden border-4 border-background shadow-xl mx-auto"
          >
            <img
              alt="James Wilson"
              src="https://randomuser.me/api/portraits/men/29.jpg"
              class="w-full h-full object-cover"
            />
          </div>
          <button
            class="absolute bottom-1 right-1 size-8 bg-primary text-primary-foreground rounded-full flex items-center justify-center border-2 border-background shadow-md"
          >
            <iconify-icon icon="solar:pen-bold" width="16" height="16"></iconify-icon>
          </button>
        </div>
        <h1 class="font-heading text-2xl text-foreground">James Wilson</h1>
        <p class="text-sm text-muted-foreground">Florida, USA • Member since 2023</p>
        <div class="flex justify-center gap-6 mt-6">
          <div class="text-center">
            <span class="block text-xl font-heading text-foreground">14</span
            ><span class="text-[10px] font-bold text-muted-foreground uppercase tracking-wider"
              >Level</span
            >
          </div>
          <div class="w-px h-8 bg-border self-center"></div>
          <div class="text-center">
            <span class="block text-xl font-heading text-foreground">1,240</span
            ><span class="text-[10px] font-bold text-muted-foreground uppercase tracking-wider"
              >Points</span
            >
          </div>
          <div class="w-px h-8 bg-border self-center"></div>
          <div class="text-center">
            <span class="block text-xl font-heading text-foreground">24</span
            ><span class="text-[10px] font-bold text-muted-foreground uppercase tracking-wider"
              >Badges</span
            >
          </div>
        </div>
      </header>
      <main class="flex-1 overflow-y-auto px-6 pb-24 space-y-6">
        <section>
          <div class="flex justify-between items-center mb-4">
            <h2 class="font-heading text-lg text-foreground">My Locker</h2>
            <button class="text-xs font-bold text-primary">Edit Bag</button>
          </div>
          <div class="flex gap-4 overflow-x-auto no-scrollbar pb-2">
            <div
              class="bg-card p-4 rounded-xl border border-border min-w-[130px] flex flex-col items-center justify-center text-center shadow-sm"
            >
              <div class="size-12 rounded-full bg-primary/5 flex items-center justify-center mb-2">
                <iconify-icon
                  icon="mdi:golf-tee"
                  class="text-primary"
                  width="24"
                  height="24"
                ></iconify-icon>
              </div>
              <p class="text-xs font-bold text-foreground">Driver</p>
              <p class="text-[10px] text-muted-foreground">Titleist TSR2</p>
            </div>
            <div
              class="bg-card p-4 rounded-xl border border-border min-w-[130px] flex flex-col items-center justify-center text-center shadow-sm"
            >
              <div class="size-12 rounded-full bg-primary/5 flex items-center justify-center mb-2">
                <iconify-icon
                  icon="solar:ruler-angular-bold"
                  class="text-primary"
                  width="24"
                  height="24"
                ></iconify-icon>
              </div>
              <p class="text-xs font-bold text-foreground">Irons</p>
              <p class="text-[10px] text-muted-foreground">P790 4-PW</p>
            </div>
            <div
              class="bg-card p-4 rounded-xl border border-border min-w-[130px] flex flex-col items-center justify-center text-center shadow-sm"
            >
              <div class="size-12 rounded-full bg-primary/5 flex items-center justify-center mb-2">
                <iconify-icon
                  icon="solar:flag-bold"
                  class="text-primary"
                  width="24"
                  height="24"
                ></iconify-icon>
              </div>
              <p class="text-xs font-bold text-foreground">Putter</p>
              <p class="text-[10px] text-muted-foreground">Newport 2</p>
            </div>
          </div>
        </section>
        <section class="bg-card rounded-2xl border border-border overflow-hidden">
          <div class="divide-y divide-border">
            <button
              class="w-full px-5 py-4 flex items-center justify-between hover:bg-muted/30 transition-colors"
            >
              <div class="flex items-center gap-4">
                <div class="size-8 flex items-center justify-center">
                  <iconify-icon
                    icon="solar:settings-bold"
                    class="text-muted-foreground"
                    width="20"
                    height="20"
                  ></iconify-icon>
                </div>
                <span class="text-sm font-medium">Account Settings</span>
              </div>
              <iconify-icon
                icon="solar:arrow-right-linear"
                class="text-muted-foreground"
                width="16"
                height="16"
              ></iconify-icon></button
            ><button
              class="w-full px-5 py-4 flex items-center justify-between hover:bg-muted/30 transition-colors"
            >
              <div class="flex items-center gap-4">
                <div class="size-8 flex items-center justify-center">
                  <iconify-icon
                    icon="solar:card-2-bold"
                    class="text-muted-foreground"
                    width="20"
                    height="20"
                  ></iconify-icon>
                </div>
                <span class="text-sm font-medium">Subscription Plan</span>
              </div>
              <div class="flex items-center gap-2">
                <span class="text-[10px] font-bold bg-accent/20 text-accent px-2 py-0.5 rounded"
                  >PRO</span
                ><iconify-icon
                  icon="solar:arrow-right-linear"
                  class="text-muted-foreground"
                  width="16"
                  height="16"
                ></iconify-icon>
              </div></button
            ><button
              class="w-full px-5 py-4 flex items-center justify-between hover:bg-muted/30 transition-colors"
            >
              <div class="flex items-center gap-4">
                <div class="size-8 flex items-center justify-center">
                  <iconify-icon
                    icon="solar:medal-ribbon-bold"
                    class="text-muted-foreground"
                    width="20"
                    height="20"
                  ></iconify-icon>
                </div>
                <span class="text-sm font-medium">Achievements</span>
              </div>
              <iconify-icon
                icon="solar:arrow-right-linear"
                class="text-muted-foreground"
                width="16"
                height="16"
              ></iconify-icon></button
            ><button
              class="w-full px-5 py-4 flex items-center justify-between hover:bg-muted/30 transition-colors"
            >
              <div class="flex items-center gap-4">
                <div class="size-8 flex items-center justify-center">
                  <iconify-icon
                    icon="solar:question-square-bold"
                    class="text-muted-foreground"
                    width="20"
                    height="20"
                  ></iconify-icon>
                </div>
                <span class="text-sm font-medium">Help &amp; Support</span>
              </div>
              <iconify-icon
                icon="solar:arrow-right-linear"
                class="text-muted-foreground"
                width="16"
                height="16"
              ></iconify-icon></button
            ><button
              class="w-full px-5 py-4 flex items-center justify-between hover:bg-muted/10 transition-colors"
            >
              <div class="flex items-center gap-4">
                <div class="size-8 flex items-center justify-center">
                  <iconify-icon
                    icon="solar:logout-bold"
                    class="text-destructive"
                    width="20"
                    height="20"
                  ></iconify-icon>
                </div>
                <span class="text-sm font-medium text-destructive">Sign Out</span>
              </div>
            </button>
          </div>
        </section>
      </main>
      <nav
        class="fixed bottom-0 w-full bg-card/95 backdrop-blur-md border-t border-border pb-safe pt-2"
      >
        <div class="flex justify-around items-center px-4 h-16">
          <a href="#" class="flex flex-col items-center gap-1 text-muted-foreground"
            ><iconify-icon icon="solar:home-2-bold" width="24" height="24"></iconify-icon
            ><span class="text-[10px] font-medium">Home</span></a
          ><a href="#" class="flex flex-col items-center gap-1 text-muted-foreground"
            ><iconify-icon icon="solar:notebook-bookmark-bold" width="24" height="24"></iconify-icon
            ><span class="text-[10px] font-medium">Learn</span></a
          ><a href="#" class="flex flex-col items-center gap-1 text-muted-foreground"
            ><iconify-icon icon="solar:chart-square-bold" width="24" height="24"></iconify-icon
            ><span class="text-[10px] font-medium">Stats</span></a
          ><a href="#" class="flex flex-col items-center gap-1 text-primary"
            ><iconify-icon icon="solar:user-bold" width="24" height="24"></iconify-icon
            ><span class="text-[10px] font-bold">Profile</span></a
          >
        </div>
      </nav>
    </div>
  </body>
</html>
