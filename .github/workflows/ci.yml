name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: inspect
          POSTGRES_PASSWORD: inspect
          POSTGRES_DB: inspect
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://inspect:inspect@localhost:5432/inspect?schema=public"
      REDIS_URL: "redis://localhost:6379"
      # CI-only throwaway secrets (never reused anywhere else).
      JWT_ACCESS_SECRET: "iM04fRyCsDYCIN3-JkNKQ0vU-22ob_r23OCe8k0HApI"
      JWT_REFRESH_SECRET: "ylzRdtnHklnbE4TacM4xDFrJET_p8SWaJYC6bj_wvDY"
      BOOTSTRAP_ADMIN_EMAIL: "ci-admin@inspect.local"
      BOOTSTRAP_ADMIN_PASSWORD: "Ci-Adm1n-YCvfwL_BY-cojInYDETZ"
      BOOTSTRAP_ADMIN_NAME: "CI Admin"
      S3_ENDPOINT: "http://localhost:9000"
      S3_REGION: "us-east-1"
      S3_BUCKET: "inspect-photos"
      S3_ACCESS_KEY_ID: "minioadmin"
      S3_SECRET_ACCESS_KEY: "minioadmin"
      S3_FORCE_PATH_STYLE: "true"
      # Fail the integration step if MinIO/bucket setup broke — otherwise the
      # byte-path test would skip silently and INS-023 coverage could vanish
      # while CI stays green.
      REQUIRE_STORAGE: "1"
      TURBO_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Spec §7's named footgun (INS-086): a second React in the workspace
      # breaks hooks at runtime and lets the wrong @types/react win type-checks.
      # The root pnpm.overrides pins one version; this asserts the pin actually
      # held across the whole linked tree (not the .pnpm store, which may keep
      # orphaned dirs). Checks every workspace package at every depth.
      - name: Exactly one React resolves
        run: |
          node -e "
          const { execSync } = require('node:child_process');
          const out = JSON.parse(execSync('pnpm ls -r react react-dom --depth Infinity --json', { maxBuffer: 64 * 1024 * 1024 }).toString());
          const versions = { react: new Set(), 'react-dom': new Set() };
          const walk = (deps) => { for (const [name, info] of Object.entries(deps ?? {})) { if (versions[name]) versions[name].add(info.version); walk(info.dependencies); } };
          for (const pkg of out) { walk(pkg.dependencies); walk(pkg.devDependencies); }
          let ok = true;
          for (const [name, set] of Object.entries(versions)) {
            console.log(name, '->', [...set].join(', ') || '(not found)');
            if (set.size !== 1) ok = false;
          }
          if (!ok) { console.error('Expected exactly one resolved version of react and react-dom across the workspace — the root pnpm.overrides pin failed'); process.exit(1); }
          "

      # MinIO needs a start command, so it can't be a GitHub service container.
      # REQUIRE_STORAGE=1 (above) makes the byte-path spec HARD-FAIL when storage
      # or the bucket is missing, so a MinIO failure fails the job either way;
      # continue-on-error here only defers it to the integration step, which
      # reports the actual cause instead of a bare setup-step failure.
      - name: Start MinIO
        continue-on-error: true
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null; then
              echo "MinIO is up"
              exit 0
            fi
            sleep 2
          done
          echo "MinIO did not become healthy in time"
          exit 1

      - name: Create MinIO bucket
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_REGION: us-east-1
        run: aws --endpoint-url http://localhost:9000 s3 mb s3://inspect-photos

      - name: Generate Ed25519 report-signing key
        run: |
          node -e "const { generateKeyPairSync } = require('node:crypto'); const { privateKey } = generateKeyPairSync('ed25519'); process.stdout.write(privateKey.export({ type: 'pkcs8', format: 'pem' }));" > /tmp/report-signing-key.pem
          {
            echo "REPORT_SIGNING_PRIVATE_KEY_PEM<<PEM_EOF"
            cat /tmp/report-signing-key.pem
            echo "PEM_EOF"
          } >> "$GITHUB_ENV"
          rm /tmp/report-signing-key.pem

      - name: Apply database migrations
        run: pnpm --filter @inspect/api exec prisma migrate deploy

      - name: Seed database
        run: pnpm --filter @inspect/api exec prisma db seed

      - name: Type-check
        run: pnpm type-check

      - name: Unit tests (API)
        run: pnpm --filter @inspect/api test

      # The Vitest suites (web 38, domain, api-client, mobile capture-core)
      # were never run by CI before 2026-08-31 — only the API's Jest suite was.
      - name: Unit tests (web, packages, mobile)
        run: pnpm exec turbo run test --filter=!@inspect/api

      - name: Integration tests (API)
        run: pnpm --filter @inspect/api test:integration

      - name: Build (API)
        run: pnpm --filter @inspect/api build

      # INS-048: lint is now a real gate. Both apps moved to ESLint 9 flat
      # configs (the API's .eslintrc.js and the web's `next lint` were both dead
      # ends), so `pnpm lint` runs clean and a regression fails the build.
      - name: Lint
        run: pnpm lint

      # INS-084: the committed contract must match the live route table, or the
      # artifact tooling reads is quietly wrong.
      - name: OpenAPI contract is current
        run: |
          pnpm --filter @inspect/api openapi:generate
          git diff --exit-code -- apps/api/openapi.json \
            || (echo "::error::openapi.json is stale — run 'pnpm api openapi:generate' and commit the result" && exit 1)

      - name: Build (web)
        run: pnpm --filter @inspect/web build
